<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica - Deputado Estadual</title>
  <link rel="stylesheet" href="../css/urna.css">
</head>
<body>

  <div class="urna-container">
    
    <!-- TELA DA URNA -->
    <div class="tela">
      
      <div class="tela-cabecalho">
        <span class="cargo-titulo">SEU VOTO PARA</span>
        <h2 class="cargo-nome">DEPUTADO ESTADUAL</h2>
      </div>

      <div class="tela-conteudo">
        <div class="info-candidato">
          
          <div class="campo-numero">
            <span class="label">Número:</span>
            <div class="boxes-numero">
              <div class="box-num" id="dito1"></div>
              <div class="box-num" id="dito2"></div>
              <div class="box-num" id="dito3"></div>
              <div class="box-num" id="dito4"></div>
              <div class="box-num" id="dito5"></div>
            </div>
          </div>

          <div class="dados-resposta hidden" id="dados-candidato">
            <p><span class="label">Nome:</span> <strong id="nome-cand">--</strong></p>
            <p><span class="label">Partido:</span> <span id="partido-cand">--</span></p>
          </div>

          <div class="mensagem-voto hidden" id="msg-voto">
            <h3 id="texto-msg">VOTO EM BRANCO</h3>
          </div>

        </div>

        <div class="foto-candidato hidden" id="container-foto">
          <div class="moldura-foto">
            <img id="img-candidato" src="" alt="Foto do Candidato">
          </div>
          <span class="legenda-foto">Deputado Est.</span>
        </div>
      </div>

      <!-- RODAPÉ COM CONFIRMAÇÃO PISCANDO -->
      <div class="rodape-confirmacao">
        <div class="alerta-confirma">CONFIRME SEU VOTO</div>
        <div class="instrucoes">
          Aperte a tecla:<br>
          <strong>VERDE</strong> para <strong>CONFIRMAR</strong> este voto<br>
          <strong>LARANJA</strong> para <strong>CORRIGE</strong> este voto
        </div>
      </div>

    </div>

    <!-- TECLADO DA URNA -->
    <div class="teclado">
      
      <div class="marca-urna">MUNDO SENAI - ESTÂNCIA</div>

      <div class="teclas-numericas">
        <button class="btn-num">1</button>
        <button class="btn-num">2</button>
        <button class="btn-num">3</button>
        <button class="btn-num">4</button>
        <button class="btn-num">5</button>
        <button class="btn-num">6</button>
        <button class="btn-num">7</button>
        <button class="btn-num">8</button>
        <button class="btn-num">9</button>
        <button class="btn-num btn-zero">0</button>
      </div>

      <div class="teclas-acoes">
        <button class="btn-acao btn-branco">BRANCO</button>
        <button class="btn-acao btn-corrige">CORRIGE</button>
        <button class="btn-acao btn-confirma">CONFIRMA</button>
      </div>

    </div>

  </div>

</body>
</html>
