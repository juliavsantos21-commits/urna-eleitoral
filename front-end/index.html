<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo SENAI 2026 - Cadastro de Eleitor</title>
  <!-- Caminho corrigido para a tua estrutura de pastas -->
  <link rel="stylesheet" href="../css/inicio.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">MUNDO SENAI 2026 - ELEIÇÕES</h1>
      <p class="subtitle">Cadastro de Eleitor - Sergipe</p>
    </div>

    <form id="form-cadastro" class="form-cadastro">
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input 
          type="text" 
          id="nome" 
          name="nome" 
          placeholder="Digite seu nome completo" 
          required 
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input 
          type="text" 
          id="cpf" 
          name="cpf" 
          placeholder="000.000.000-00" 
          maxlength="14" 
          required 
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn-votar">
        IR PARA A CABINE DE VOTAÇÃO &gt;
      </button>
    </form>

    <div class="footer-info">
      🔒 Voto secreto e seguro • SENAI Sergipe
    </div>
  </div>

</body>
</html>
