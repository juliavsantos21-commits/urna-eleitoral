<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica - Fim</title>
  <!-- Estilo base da urna (carcaça e teclado) -->
  <link rel="stylesheet" href="../css/urna.css">
  <!-- Estilo exclusivo da tela final -->
  <link rel="stylesheet" href="../css/fim.css">
</head>
<body>

  <div class="urna-container">
    
    <!-- TELA DA URNA -->
    <div class="tela tela-fim">
      
      <div class="conteudo-fim">
        <h1 class="texto-fim">FIM</h1>
        <p class="subtexto-fim">VOTAÇÃO ENCERRADA</p>
      </div>

    </div>

    <!-- TECLADO DA URNA (DESATIVADO NA TELA FINAL) -->
    <div class="teclado teclado-desativado">
      
      <div class="marca-urna">JUSTIÇA ELEITORAL</div>

      <div class="teclas-numericas">
        <button class="btn-num" disabled>1</button>
        <button class="btn-num" disabled>2</button>
        <button class="btn-num" disabled>3</button>
        <button class="btn-num" disabled>4</button>
        <button class="btn-num" disabled>5</button>
        <button class="btn-num" disabled>6</button>
        <button class="btn-num" disabled>7</button>
        <button class="btn-num" disabled>8</button>
        <button class="btn-num" disabled>9</button>
        <button class="btn-num btn-zero" disabled>0</button>
      </div>

      <div class="teclas-acoes">
        <button class="btn-acao btn-branco" disabled>BRANCO</button>
        <button class="btn-acao btn-corrige" disabled>CORRIGE</button>
        <button class="btn-acao btn-confirma" disabled>CONFIRMA</button>
      </div>

    </div>

  </div>

</body>
</html>
